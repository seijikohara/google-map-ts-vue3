pre-commit:
  jobs:
    - name: format staged files
      run: pnpm oxfmt {staged_files}
      glob: '*.{ts,js,mjs,cjs,vue,json,md,yml,yaml}'
      stage_fixed: true
    - name: lint staged files
      run: pnpm oxlint --fix {staged_files}
      glob: '*.{ts,js,mjs,cjs,vue}'
      stage_fixed: true
    - name: eslint staged vue files
      run: pnpm eslint --fix {staged_files}
      glob: '*.vue'
      stage_fixed: true

pre-push:
  jobs:
    - name: lint
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
